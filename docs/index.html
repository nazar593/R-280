<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ROADLINE — DEV 02</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151a20;color:white;font:14px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#bar{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:5px;z-index:2;pointer-events:none}button{pointer-events:auto;background:#17222be8;color:white;border:1px solid #83929a;border-radius:7px;padding:9px 12px;font:inherit;touch-action:none}button.on{background:#49664e}#info{position:fixed;top:65px;left:12px;white-space:pre-line;text-shadow:0 1px 4px black;pointer-events:none}#controls{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,53px);gap:4px}.pad button{height:49px;font-size:20px;padding:0}.pad span{height:49px}.right{display:flex;gap:5px;flex-direction:column}#notice{position:fixed;inset:0;display:grid;place-items:center;background:#141b23;padding:30px;text-align:center;z-index:3}#hud{position:fixed;inset:0;pointer-events:none;display:none}#hud i{position:absolute;top:50%;height:1px;background:#4cea6f;width:37%}#hud i:first-child{left:8%}#hud i:nth-child(2){right:8%}#ring{position:absolute;left:50%;top:50%;width:12px;height:12px;border:1px solid #4cea6f;border-radius:100%;transform:translate(-50%,-50%)}#cross{position:absolute;left:50%;top:50%;color:white;font:12px monospace;transform:translate(-50%,-50%)}
</style></head><body>
<div id="notice">Загрузка 3D-движка… Интернет необходим для загрузки Three.js.</div>
<div id="bar"><button data-mode="driver" class="on">Водитель</button><button data-mode="passenger">Пассажир</button><button data-mode="observer">Наблюдатель</button><button data-mode="drone">Полёт</button><button id="cam">Камера</button><button id="reset">Сброс</button></div>
<div id="info"></div><div id="hud"><i></i><i></i><div id="ring"></div><div id="cross">×</div></div>
<div id="controls"><div class="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="right"><button data-key="asc">Вверх</button><button data-key="desc">Вниз / тормоз</button></div></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=x=>document.querySelector(x);let renderer;
try{renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){$('#notice').textContent='WebGL недоступен на этом устройстве.';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);$('#notice').style.display='none';
const scene=new T.Scene();scene.background=new T.Color(0xa1b5c5);scene.fog=new T.Fog(0xa1b5c5,90,380);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.08,500);
scene.add(new T.HemisphereLight(0xe5edff,0x64734b,2));const sun=new T.DirectionalLight(0xfff1cf,2.1);sun.position.set(20,50,25);scene.add(sun);
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.87});const grass=mat(0x526943),road=mat(0x35383b),stripe=mat(0xd7d5c4),body=mat(0x7e8872),glass=mat(0x394b56),black=mat(0x171c20),silver=mat(0x9aa3a0),wood=mat(0x6a5944),leaf=mat(0x345839);
function box(parent,w,h,d,x,y,z,m){let a=new T.Mesh(new T.BoxGeometry(w,h,d),m);a.position.set(x,y,z);parent.add(a);return a;}
box(scene,500,.2,1200,0,-.2,0,grass);box(scene,8,.1,1200,0,-.04,0,road);for(let z=-590;z<600;z+=11)box(scene,.11,.012,4,0,.02,z,stripe);for(const x of [-3.7,3.7])box(scene,.10,.012,1200,x,.02,0,stripe);
let seed=41;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}const tg=new T.CylinderGeometry(.16,.25,2.7,7),lg=new T.ConeGeometry(1.7,4.5,8);
for(let i=0;i<145;i++){let side=i%2?1:-1,x=side*(13+rand()*45),z=rand()*1120-560;const a=new T.Mesh(tg,wood);a.position.set(x,1.35,z);scene.add(a);const b=new T.Mesh(lg,leaf);b.position.set(x,3.5,z);scene.add(b);}
const car=new T.Group();scene.add(car);box(car,1.9,.48,4.6,0,.75,0,body);box(car,1.85,.7,1.8,0,1.3,-.35,body);box(car,1.7,.48,1.76,0,1.65,-.35,glass);box(car,1.87,.12,1.85,0,1.95,-.35,body);box(car,1.85,.43,1.2,0,1.04,-1.75,body);
for(const x of [-.86,.86])box(car,.14,.38,1.68,x,1.1,1.38,body);box(car,1.85,.38,.14,0,1.1,2.15,body);
const wheels=[];for(const x of [-.97,.97])for(const z of [-1.45,1.45]){const pivot=new T.Group();pivot.position.set(x,.46,z);car.add(pivot);const wheel=new T.Mesh(new T.CylinderGeometry(.43,.43,.25,18),black);wheel.rotation.z=Math.PI/2;pivot.add(wheel);const hub=new T.Mesh(new T.CylinderGeometry(.22,.22,.26,12),silver);hub.rotation.z=Math.PI/2;pivot.add(hub);wheels.push(pivot);}
const drone=new T.Group();scene.add(drone);box(drone,.38,.22,.60,0,0,0,black);for(const x of [-.55,.55])for(const z of [-.45,.45]){box(drone,.7,.055,.08,x/2,0,z,black);const rotor=new T.Mesh(new T.CylinderGeometry(.23,.23,.025,16),silver);rotor.position.set(x,.04,z);drone.add(rotor);}
let mode='driver',chase=false,v=0,heading=0,look=0,pitch=0,dv=new T.Vector3(),keys={},fps=0;
// Abstract arcade flight parameters for the browser prototype, in scene units.
const flight={speed:9,yaw:0,turn:0,climb:0,bank:0,nose:0};
const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-k*dt));
function resetFlight(){drone.position.set(0,9,0);flight.speed=9;flight.yaw=0;flight.turn=0;flight.climb=0;flight.bank=0;flight.nose=0;dv.set(0,0,-9);drone.rotation.set(0,0,0);}
function wrap(n,half){return ((n+half)%(2*half)+2*half)%(2*half)-half;}
function reset(){car.position.set(-1.65,0,0);heading=0;v=0;car.rotation.y=0;resetFlight();look=0;pitch=0;}reset();
function setMode(m){mode=m;look=0;pitch=0;chase=false;keys={};document.querySelector('[data-key="up"]').textContent=m==='drone'?'+':'▲';document.querySelector('[data-key="down"]').textContent=m==='drone'?'−':'▼';document.querySelector('[data-key="asc"]').textContent=m==='drone'?'Набор высоты':'Вверх';document.querySelector('[data-key="desc"]').textContent=m==='drone'?'Снижение':'Тормоз';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));$('#hud').style.display=m==='drone'?'block':'none';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#cam').onclick=()=>chase=!chase;$('#reset').onclick=reset;
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[k]=false;});
const km={w:'up',a:'left',s:'down',d:'right',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',e:'asc',q:'desc',' ':'desc'};addEventListener('keydown',e=>{if(km[e.key]){keys[km[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(km[e.key])keys[km[e.key]]=false});addEventListener('blur',()=>keys={});document.addEventListener('visibilitychange',()=>keys={});
let drag=null;renderer.domElement.onpointerdown=e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;look-=(e.clientX-drag[0])*.004;pitch=T.MathUtils.clamp(pitch-(e.clientY-drag[1])*.004,-.8,.8);drag=[e.clientX,e.clientY]};renderer.domElement.onpointerup=renderer.domElement.onpointercancel=()=>drag=null;
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
const clock=new T.Clock();const forward=new T.Vector3(),local=new T.Vector3(),target=new T.Vector3();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);fps=.94*fps+.06/Math.max(dt,.001);let steer=(keys.left?1:0)-(keys.right?1:0);let throttle=(keys.up?1:0)-(keys.down?1:0);
if(mode!=='drone'){let desired=mode==='driver'?throttle*13:5; if(mode==='driver'&&keys.desc)desired=0;v+=(desired-v)*Math.min(1,dt*(keys.desc?6:1.5));if(mode==='driver')heading+=steer*v*.035*dt;else{let error=car.position.x+1.65;heading+=(Math.atan2(error,12)-heading)*dt*.8;}car.rotation.y=heading;forward.set(-Math.sin(heading),0,-Math.cos(heading));car.position.addScaledVector(forward,v*dt);if(Math.abs(car.position.z)>560)reset();if(Math.abs(car.position.x)>100)reset();for(const w of wheels)w.rotateX(v*dt/.43);drone.visible=false;car.visible=chase;
if(chase){local.set(0,3.3,7);local.applyAxisAngle(T.Object3D.DEFAULT_UP,heading+look);camera.position.copy(car.position).add(local);camera.lookAt(car.position.clone().add(new T.Vector3(0,1,0)));}else{local.set(mode==='driver'?-.37:mode==='passenger'?.37:0,mode==='observer'?2.15:1.77,mode==='observer'?1.3:-.6);local.applyAxisAngle(T.Object3D.DEFAULT_UP,heading);camera.position.copy(car.position).add(local);camera.rotation.set(pitch,heading+look,0,'YXZ');}}
else{
car.visible=true;drone.visible=chase;
// Always moving along the current course. No hover or reverse mode.
const climbInput=(keys.asc?1:0)-(keys.desc?1:0);
flight.speed=T.MathUtils.clamp(flight.speed+throttle*dt*5,5,16);
flight.turn=damp(flight.turn,steer,3.5,dt);
flight.yaw=wrap(flight.yaw+flight.turn*dt*1.05,Math.PI);
flight.climb=damp(flight.climb,climbInput*4,2.4,dt);
flight.bank=damp(flight.bank,-flight.turn*.38,3.5,dt);
flight.nose=damp(flight.nose,climbInput*.18,2.8,dt);
dv.set(-Math.sin(flight.yaw)*flight.speed,flight.climb,-Math.cos(flight.yaw)*flight.speed);
drone.position.addScaledVector(dv,dt);
drone.position.y=T.MathUtils.clamp(drone.position.y,3,60);
if((drone.position.y===3&&flight.climb<0)||(drone.position.y===60&&flight.climb>0))flight.climb=0;
// Wrap the test arena instead of clamping horizontal position to a wall.
drone.position.x=wrap(drone.position.x,110);
drone.position.z=wrap(drone.position.z,560);
drone.rotation.set(flight.nose,flight.yaw,flight.bank,'YXZ');
if(chase){
local.set(0,2,5).applyAxisAngle(T.Object3D.DEFAULT_UP,flight.yaw+look);
camera.position.copy(drone.position).add(local);camera.lookAt(drone.position);
}else{
camera.position.copy(drone.position);camera.rotation.set(pitch,flight.yaw+look,0,'YXZ');
}
$('#cross').style.top=(50+pitch*18)+'%';
}
$('#hud').style.display=mode==='drone'&&!chase?'block':'none';$('#info').textContent='DEV 02 • '+(mode==='drone'?'Высота '+drone.position.y.toFixed(1)+' • Скорость '+flight.speed.toFixed(1)+' ед/с':mode==='driver'?'Ручное управление':'Автовождение — тест')+'\n'+(mode==='drone'?' + / −: скорость • ◀ / ▶: курс • ':Math.round(Math.abs(v)*3.6)+' км/ч • ')+Math.round(fps)+' FPS';renderer.render(scene,camera);}loop();
</script></body></html>
