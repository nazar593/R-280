name: Godot Android Stage 01
on:
  push:
    branches: [godot-stage-01]
    paths:
      - 'GodotProject/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Godot 4.5.1
        run: |
          set -euxo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable
          curl -fL --retry 3 "$base/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and smoke test
        run: |
          set -euo pipefail
          godot --headless --path GodotProject --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi
          timeout 90 godot --headless --path GodotProject -- --smoke-test 2>&1 | tee /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/smoke.log; then exit 1; fi
          grep -q 'role initialization smoke test complete' /tmp/smoke.log
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Configure Android SDK and export templates
        run: |
          set -euxo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$sdk"
          export ANDROID_SDK_ROOT="$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          manager="$(command -v sdkmanager || find "$sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$manager"
          test -x "$sdk/build-tools/35.0.0/apksigner"
          test -f "$sdk/platforms/android-35/android.jar"
          base=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable
          curl -fL --retry 3 "$base/Godot_v4.5.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$dest" "$HOME/.config/godot" "$HOME/.android"
          unzip -q -j /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk -d "$dest"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$sdk" "$JAVA_HOME" "$HOME/.android/debug.keystore" > "$HOME/.config/godot/editor_settings-4.5.tres"
      - name: Export APK
        run: |
          set -euxo pipefail
          mkdir -p GodotProject/build
          godot --headless --path GodotProject --export-debug Android build/R280-stage01.apk
          test -s GodotProject/build/R280-stage01.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify GodotProject/build/R280-stage01.apk
      - uses: actions/upload-artifact@v4
        with:
          name: R280-stage01-APK
          path: GodotProject/build/R280-stage01.apk
          if-no-files-found: error
