name: Roadline P280 Unity 6 APK

on:
  push:
    branches: [roadline-p280-android]
    paths:
      - 'Roadline_P280/**'
      - '.github/workflows/roadline-p280-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadline-p280-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity activation settings
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; } ||
             [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Configure UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro), plus UNITY_EMAIL and UNITY_PASSWORD. See https://game.ci/docs/github/activation/"
            exit 1
          fi
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Roadline_P280
          unityVersion: 6000.0.60f1
          targetPlatform: Android
          buildMethod: Roadline.Editor.RoadlineBuild.BuildAndroid
          androidExportType: androidPackage
          versioning: None
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Roadline-P280-Android
          path: |
            Roadline_P280/Builds/Roadline-P280.apk
            Builds/Roadline-P280.apk
          if-no-files-found: error
          retention-days: 7
